# Workflow GitHub Actions per il deployment automatico del portfolio su GitHub Pages
name: Deploy di GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa le dipendenze
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Compila il sito statico con Vite
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || './' }}
        run: npm run build:static

      - name: Assicura file .nojekyll e 404 per GitHub Pages
        run: |
          touch dist/.nojekyll
          if [ -f public/404.html ]; then cp public/404.html dist/404.html; fi

      - name: Carica gli elementi compilati (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

